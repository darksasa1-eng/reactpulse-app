name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & route check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Render every route (smoke test)
        run: npm run check:routes

      - name: Server syntax check
        run: node --check server/index.js

      - name: Guard - no API key committed
        run: |
          if grep -rIn --exclude-dir=node_modules --exclude-dir=.git "Sasa_Dev_Api_[A-Za-z0-9]\{20,\}" . ; then
            echo "::error::An API key appears to be committed. Remove it and use environment variables instead."
            exit 1
          fi
          echo "No API key found in the source tree."
